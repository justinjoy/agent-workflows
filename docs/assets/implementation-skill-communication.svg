<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Implementation Skill persona communication map</title>
  <desc id="desc">A radial communication diagram with the Coordinator at the center, User at the top, and Architect, Critic, Implementer, and Reviewer arranged around it. Curved lines show prompts sent by the Coordinator and artifacts returned by each persona.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="returnArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="accentArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .ring { fill: none; stroke: #dbeafe; stroke-width: 2; stroke-dasharray: 8 10; }
      .title { fill: #0f172a; font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #475569; font-family: Arial, sans-serif; font-size: 16px; }
      .coord { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.8; rx: 16; }
      .user { fill: #ecfccb; stroke: #65a30d; stroke-width: 2.2; rx: 14; }
      .role { fill: #f1f5f9; stroke: #64748b; stroke-width: 2.2; rx: 14; }
      .gate { fill: #fffbeb; stroke: #d97706; stroke-width: 2.2; rx: 14; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 10; }
      .feedbackCard { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.4; rx: 10; }
      .label { fill: #0f172a; font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; }
      .body { fill: #334155; font-family: Arial, sans-serif; font-size: 14px; }
      .small { fill: #1e293b; font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .muted { fill: #475569; font-family: Arial, sans-serif; font-size: 12px; }
      .send { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #475569; stroke-width: 2.2; fill: none; stroke-dasharray: 7 6; marker-end: url(#returnArrow); }
      .feedback { stroke: #b45309; stroke-width: 2.5; fill: none; marker-end: url(#accentArrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="980"/>

  <text class="title" x="48" y="58">Implementation Skill: persona communication</text>
  <text class="subtitle" x="48" y="84">The Coordinator sits at the center; independent personas exchange scoped prompts and raw artifacts around it.</text>

  <ellipse class="ring" cx="600" cy="462" rx="430" ry="300"/>

  <rect class="coord" x="470" y="388" width="260" height="128"/>
  <text class="label" x="600" y="431" text-anchor="middle">Coordinator</text>
  <text class="body" x="600" y="459" text-anchor="middle">routes scoped prompts</text>
  <text class="body" x="600" y="482" text-anchor="middle">collects raw artifacts</text>

  <rect class="user" x="480" y="126" width="240" height="82"/>
  <text class="label" x="600" y="159" text-anchor="middle">User</text>
  <text class="body" x="600" y="184" text-anchor="middle">request and constraints</text>

  <rect class="role" x="90" y="250" width="240" height="100"/>
  <text class="label" x="210" y="289" text-anchor="middle">Architect</text>
  <text class="body" x="210" y="316" text-anchor="middle">design, scope, tests,</text>
  <text class="body" x="210" y="336" text-anchor="middle">atomic plan</text>

  <rect class="role" x="870" y="250" width="240" height="100"/>
  <text class="label" x="990" y="289" text-anchor="middle">Critic</text>
  <text class="body" x="990" y="316" text-anchor="middle">risks, coupling,</text>
  <text class="body" x="990" y="336" text-anchor="middle">unsafe assumptions</text>

  <rect class="role" x="90" y="590" width="240" height="100"/>
  <text class="label" x="210" y="629" text-anchor="middle">Implementer</text>
  <text class="body" x="210" y="656" text-anchor="middle">diffs, validation,</text>
  <text class="body" x="210" y="676" text-anchor="middle">atomic commits</text>

  <rect class="role" x="870" y="590" width="240" height="100"/>
  <text class="label" x="990" y="629" text-anchor="middle">Reviewer</text>
  <text class="body" x="990" y="656" text-anchor="middle">findings against</text>
  <text class="body" x="990" y="676" text-anchor="middle">the raw diff</text>

  <rect class="gate" x="475" y="760" width="250" height="76"/>
  <text class="label" x="600" y="790" text-anchor="middle">Final Gate</text>
  <text class="body" x="600" y="814" text-anchor="middle">Architect + Critic validate</text>

  <path class="send" d="M585 208 C560 276 560 332 580 378"/>
  <path class="return" d="M623 388 C655 326 650 272 616 208"/>
  <rect class="card" x="732" y="132" width="180" height="58"/>
  <text class="small" x="822" y="156" text-anchor="middle">User exchange</text>
  <text class="muted" x="822" y="176" text-anchor="middle">request in, report out</text>

  <path class="send" d="M470 414 C400 386 362 334 330 308"/>
  <path class="return" d="M330 334 C390 386 420 438 470 456"/>
  <rect class="card" x="332" y="236" width="160" height="58"/>
  <text class="small" x="412" y="260" text-anchor="middle">Architect</text>
  <text class="muted" x="412" y="280" text-anchor="middle">objective -> plan</text>

  <path class="send" d="M730 414 C800 386 838 334 870 308"/>
  <path class="return" d="M870 334 C810 386 780 438 730 456"/>
  <rect class="card" x="708" y="300" width="160" height="58"/>
  <text class="small" x="788" y="324" text-anchor="middle">Critic</text>
  <text class="muted" x="788" y="344" text-anchor="middle">plan -> objections</text>

  <path class="send" d="M470 492 C405 526 366 584 330 630"/>
  <path class="return" d="M330 662 C400 624 430 554 470 510"/>
  <rect class="card" x="340" y="694" width="170" height="58"/>
  <text class="small" x="425" y="718" text-anchor="middle">Implementer</text>
  <text class="muted" x="425" y="738" text-anchor="middle">unit -> diff + tests</text>

  <path class="send" d="M730 492 C795 526 834 584 870 630"/>
  <path class="return" d="M870 662 C800 624 770 554 730 510"/>
  <rect class="card" x="690" y="694" width="170" height="58"/>
  <text class="small" x="775" y="718" text-anchor="middle">Reviewer</text>
  <text class="muted" x="775" y="738" text-anchor="middle">raw diff -> findings</text>

  <path class="send" d="M585 516 C565 590 570 696 590 750"/>
  <path class="return" d="M620 516 C646 590 644 696 614 750"/>
  <rect class="card" x="360" y="626" width="150" height="58"/>
  <text class="small" x="435" y="650" text-anchor="middle">Final check</text>
  <text class="muted" x="435" y="670" text-anchor="middle">final diff</text>
  <rect class="card" x="690" y="626" width="150" height="58"/>
  <text class="small" x="765" y="650" text-anchor="middle">Validation</text>
  <text class="muted" x="765" y="670" text-anchor="middle">design + risk</text>

  <path class="feedback" d="M930 700 C855 970 345 970 270 700"/>
  <rect class="feedbackCard" x="430" y="900" width="340" height="40"/>
  <text class="small" x="600" y="925" text-anchor="middle">blocking findings loop back to implementation</text>
</svg>
