[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflows"
version = "1.1.0"
description = "Datalog-selected agent workflow skills backed by PyreWire."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pyrewire>=1.0.4,<2.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7.0",
  "setuptools>=68.0",
  "wheel",
]

[project.scripts]
agent-workflows-harness = "agent_workflows_harness.cli:main"

[tool.setuptools]
packages = ["agent_workflows_harness"]
package-dir = {"" = "src"}
