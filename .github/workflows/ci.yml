# The repo had no CI until this file, and the mutation table in tests/ was
# written on that assumption: it was a checklist-only control because a
# checklist was the only mechanism there was. docs/maintenance.md still asks
# you to run it locally, for a reason that survives CI -- a SURVIVED entry is
# better found before you push than reported back to you afterwards.
name: CI

on:
  pull_request:
  # `main` only, not every branch. `pull_request` already covers work with a
  # PR open, and an unfiltered `push` would run the whole matrix twice for
  # every such push: the two events carry different refs
  # (refs/heads/<branch> vs refs/pull/N/merge), so they land in different
  # concurrency groups and neither cancels the other.
  push:
    # `spike/**` is how a control gets falsified without putting a
    # deliberately broken commit into a PR's history: branch, break the thing,
    # push, read the red run, delete the branch.
    #
    # This is not what `workflow_dispatch` is for, though the first draft of
    # this file said it was. Measured:
    #
    #   gh workflow run ci.yml --ref spike/copymode-falsifier
    #   HTTP 404: workflow ci.yml not found on the default branch
    #
    # Dispatch is only offered for workflows that already exist on the default
    # branch, so it cannot run a workflow that has never merged -- which is
    # exactly the case the comment claimed it covered. A `push` pattern works
    # from the pushed ref itself and therefore does.
    branches: [main, 'spike/**']
  # Useful once this file is on `main`: re-running the matrix on demand.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not stop the other cells when one fails. Each cell exists to observe
      # something the others cannot, so a Linux failure and a Windows failure
      # are different facts and both are wanted.
      fail-fast: false
      matrix:
        include:
          # Every ubuntu cell buys the POSIX side: mode bits, which
          # `_write_atomic` reapplies after the replace and which Windows
          # cannot observe at all -- there a fresh temp file and a source file
          # report the same mode, so an assertion about it carries no
          # information. Every ubuntu cell is also the only LF checkout. That
          # is why there are ubuntu cells; it is not why there are two, so
          # each names what it alone adds.
          #
          # There is no `ubuntu × 3.12` cell, and its absence is deliberate.
          # POSIX is covered by the two cells below, 3.12 is covered by the
          # Windows cell, and nothing here is sensitive to the intersection:
          # the mode canary needs POSIX and is version-agnostic, the CRLF lint
          # needs Windows, the toolchain-text entries want the newest
          # interpreter. A cell that observes nothing the others do not is a
          # cell whose justification has to be written for it afterwards, and
          # this file's value is that each one names what it alone adds.
          #
          # The floor `requires-python = ">=3.11"` declares, which nothing
          # checked before this file.
          - os: ubuntu-latest
            python: "3.11"
          # The newest cell, and the one that grades the table -- see the
          # `mutations` job. Most entries pin toolchain-generated
          # text (CPython's "import of X halted", pytest's assertion
          # rendering), so the table is the artifact a Python or pytest upgrade
          # actually breaks.
          - os: ubuntu-latest
            python: "3.13"
          # The CRLF checkout. `test_no_anchor_spans_more_than_one_line` exists
          # because this repo checks out CRLF on Windows, and its rationale is
          # only exercised where that is true. It is also where the read-only
          # staging-file leak was found, and the platform the maintainer uses.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Editable, with the dev extras: one test shells out to
      # `python -m build --no-isolation` and needs build/setuptools/wheel
      # importable in this same interpreter.
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      # pytest exits 0 for a skipped test, so a green suite cannot tell "the
      # platform canary ran" from "it was skipped everywhere". Read the JUnit
      # record instead -- the same reasoning the mutation runner already
      # encodes for its own verdicts, applied to CI.
      #
      # Every canary is judged against its own marker, so on any runner some
      # run and some skip and both branches of the parse execute. A check that
      # only ever fires when something is wrong is one nobody has seen work.
      #
      # The canary list is derived here rather than written down. An earlier
      # version named two nodeids in `env:`, and a third gated canary landed
      # without being added -- so the enumeration was hand-maintained, which is
      # the defect the test suite spent a whole change removing from itself.
      #
      # Pinning that list with a test would not have helped: a check that the
      # workflow's *text* names each canary is satisfied by an `env:` entry
      # nothing reads, and by a comment. Deriving dissolves the item instead,
      # and a fourth canary is covered the day it lands.
      #
      # `ast`, not a regex: the decorator is structure, and this repo has been
      # bitten by substring-matching things it should have parsed.
      - name: Every platform-gated canary ran where its own marker says it should
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, os, shutil, subprocess, sys, tempfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          SOURCE = Path("tests/test_mutations.py")

          # The extraction lives in tests/mutations.py, not here. Two callers
          # need the same answer -- this step, and the suite guard that exists
          # to notice a canary the extraction cannot see -- and while they were
          # separate copies the guard checked a transcription instead of the
          # extractor. Measured: dropping a canary from this copy left the
          # suite green.
          spec = importlib.util.spec_from_file_location("_ci_mutations", "tests/mutations.py")
          runner = importlib.util.module_from_spec(spec)
          # Registered before exec: `@dataclass` resolves annotations through
          # `sys.modules[cls.__module__].__dict__`, so an unregistered module
          # raises while defining `Verdict`. Found by running this step
          # locally, not by reading it.
          sys.modules[spec.name] = runner
          spec.loader.exec_module(runner)

          canaries = runner.platform_gated_canaries(SOURCE)
          # Fail closed. A broken walk finding nothing would otherwise pass
          # vacuously -- a derived haystack with no guard that it is derived,
          # inside the fix for a hand-maintained list.
          if not canaries:
              sys.exit(f"no platform-gated canaries found in {SOURCE}; the extraction broke")
          print(f"derived {len(canaries)} platform-gated canaries")

          # `test_every_platform_marker_uses_the_form_ci_can_parse` is what
          # keeps the walk above honest: it fails in the suite the day a
          # marker is written in a form this cannot read, rather than letting
          # the canary vanish from the derived set in silence.

          # Into a temp dir, the way `_run_node` does it. Writing the report
          # into the working directory left an untracked `observed.xml` in the
          # repo every time someone ran this step by hand -- and this is the
          # step people run by hand, because it is the one the suite cannot
          # exercise. No stray file beats an ignored stray file.
          workdir = tempfile.mkdtemp(prefix="ci-canaries-")
          try:
              report = Path(workdir) / "result.xml"
              subprocess.run(
                  [sys.executable, "-m", "pytest", "-q", "-p", "no:cacheprovider",
                   "--junit-xml", str(report), *canaries],
                  check=False,
              )
              if not report.exists():
                  sys.exit("pytest wrote no JUnit report; it failed before running anything")

              # Reuse the runner's own reconstruction rather than rebuilding it
              # here. It is the one piece of this step that already has
              # canaries. It does not cover a canary nested in a class --
              # `classname=tests.test_mutations.TestGroup` rebuilds to
              # `tests/test_mutations/TestGroup.py::…`, which is not a nodeid --
              # but that canary is invisible to the walk above anyway, and the
              # marker guard in the suite is what catches it.
              records = {
                  runner._node_id(case): case
                  for case in ET.parse(report).getroot().iter("testcase")
              }
          finally:
              shutil.rmtree(workdir, ignore_errors=True)

          missing = sorted(set(canaries) - set(records))
          if missing:
              sys.exit(f"the report holds no record for: {missing}")

          for nodeid, wants in sorted(canaries.items()):
              skipped = records[nodeid].find("skipped") is not None
              should_skip = os.name != wants
              if skipped != should_skip:
                  sys.exit(
                      f"{nodeid} wants os.name == {wants!r} and this runner is {os.name!r}, "
                      f"so it should {'skip' if should_skip else 'run'} -- "
                      f"but it {'skipped' if skipped else 'ran'}"
                  )
              print(f"  {'skipped' if skipped else 'ran':8} (wants {wants}) {nodeid}")
          PY

  mutations:
    name: mutation table
    # A red suite makes the runner abort with EXIT_UNEVALUABLE anyway, so
    # without this the job pays its full runtime to report a fact the `test`
    # job already reported, under a name that says something else.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The newest cell in the matrix. Most entries pin text
          # that CPython or pytest generates, so this is the check most likely
          # to be broken by a toolchain move, and it belongs on the newest
          # toolchain rather than the middle one.
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # --skip-self-check skips only the *duplicate* run of the self-check:
      # the full-suite precondition inside the runner collects
      # tests/test_mutations.py regardless, so a red oracle still aborts before
      # any verdict is produced. `test_the_full_suite_precondition_collects_the_self_check`
      # is what keeps that true.
      - name: Grade the table
        run: python tests/mutations.py --skip-self-check
